name: Compilar la app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: macos-latest

    steps:
      - name: Traer el código
        uses: actions/checkout@v7

      - name: Ver qué máquina y qué Xcode tocaron
        run: |
          sw_vers
          xcodebuild -version

      - name: Instalar XcodeGen y ldid
        run: brew install xcodegen ldid

      - name: Insertar el identificador de Google desde el secreto
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import os
          cliente = os.environ.get("GOOGLE_CLIENT_ID", "").strip()
          ficha = open("project.yml").read()
          if cliente:
              esquema = "com.googleusercontent.apps." + cliente.replace(".apps.googleusercontent.com", "")
              ficha = ficha.replace("__GOOGLE_CLIENT_ID__", cliente)
              ficha = ficha.replace("__GOOGLE_URL_SCHEME__", esquema)
              print("Identificador de Google insertado")
          else:
              ficha = ficha.replace("__GOOGLE_CLIENT_ID__", "")
              ficha = ficha.replace("__GOOGLE_URL_SCHEME__", "com.yelinapp.sin-google")
              print("AVISO: no hay secreto GOOGLE_CLIENT_ID; la app queda sin Drive")
          open("project.yml", "w").write(ficha)
          PY

      - name: Armar el proyecto de Xcode
        run: xcodegen generate

      - name: Compilar sin firma
        run: |
          xcodebuild \
            -project YelinApp.xcodeproj \
            -target YelinApp \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/salida" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empaquetar el .ipa
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R salida/YelinApp.app Payload/
          echo "=== metiendo los permisos en el binario ==="
          ldid -Ssideload.entitlements Payload/YelinApp.app/YelinApp
          ldid -e Payload/YelinApp.app/YelinApp
          zip -qry YelinApp.ipa Payload
          echo "=== contenido del .app ==="
          ls -l Payload/YelinApp.app
          echo "=== estructura del .ipa ==="
          unzip -l YelinApp.ipa
          echo "=== datos del Info.plist ==="
          plutil -p Payload/YelinApp.app/Info.plist
          echo "=== arquitectura del binario ==="
          lipo -info Payload/YelinApp.app/YelinApp

      - name: Publicar el .ipa para descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "compilacion-${{ github.run_number }}" YelinApp.ipa \
            --title "Compilación ${{ github.run_number }}" \
            --notes "Archivo para instalar con AltStore. Descargá YelinApp.ipa directamente, sin zip."

      - name: Dejar el .ipa también como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: YelinApp-ipa
          path: YelinApp.ipa
          retention-days: 30
