name: YelinApp

options:
  bundleIdPrefix: com.facundoyelin
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  YelinApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Fuentes
    dependencies:
      - sdk: HealthKit.framework
      - sdk: PencilKit.framework
    settings:
      base:
        PRODUCT_NAME: YelinApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.facundoyelin.yelinapp
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Yelin App
        UIAppFonts:
          - Inter-ExtraBoldItalic.otf
        NSBluetoothAlwaysUsageDescription: La app usa Bluetooth para leer la balanza y la máquina de remo.
        # Sin esto, al cambiar de app o bloquear el iPad iOS corta la entrega de
        # datos Bluetooth y la sesión de remo se queda a mitad de camino.
        UIBackgroundModes:
          - bluetooth-central
        NSHealthUpdateUsageDescription: La app anota tu peso en Salud para que Google Health lo levante.
        GIDClientID: __GOOGLE_CLIENT_ID__
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - __GOOGLE_URL_SCHEME__
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
